<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15181f">
<title>Rounds</title>
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="rounds.css">
</head>
<body>
<div class="app">
  <div class="main p10">
    <div class="opps-bar">
      <div class="opps" id="opps"></div>
      <div class="tools">
        <button class="btn btn-icon" id="btn-menu" aria-label="Menu">⋯</button>
        <div class="stat" id="stat"></div>
      </div>
    </div>
    <div class="me" id="me">
      <div class="me-head" id="me-head"><span class="me-name">You</span><span class="pill" id="phase"></span><span class="hint" id="hint"></span></div>
      <div class="stage" id="stage"></div>
    </div>
    <div class="hand-wrap"><div class="hand" id="hand"></div></div>
    <div class="side">
      <div class="piles" id="piles">
        <button class="pile deck" id="deck" aria-label="Draw from the deck"></button>
        <button class="pile discard" id="discard" aria-label="Take the discard"></button>
        <button class="log" id="log" aria-label="Game log"></button>
      </div>
      <div class="actions" id="actions"></div>
    </div>
  </div>
</div>
<script type="module" src="main.js"></script>
</body>
</html>
